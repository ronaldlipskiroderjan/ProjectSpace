spring:
  application:
    name: ProjectSpace
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/projectspace}
    username: ${DB_USERNAME:projectspace}
    password: ${DB_PASSWORD:projectspace}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
