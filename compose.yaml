services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-projectspace}
      POSTGRES_USER: ${POSTGRES_USER:-projectspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projectspace}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-projectspace}
      DB_USERNAME: ${POSTGRES_USER:-projectspace}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-projectspace}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      SERVER_PORT: 8080
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
